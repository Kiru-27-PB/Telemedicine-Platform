<div class="Bg_box">
    <center class="C">
    <div class="Login_box">
        <h2 class="Login">Login</h2>
        <form class="Login_box_stuff">
            <table class="Login_box_stuff">
                <tr class="Login_box_stuff">
                    <td class="Login_box_stuff">User Name : <input type="text" placeholder="Enter your user name"></td>
                </tr>

                <tr class="Login_box_stuff">
                    <td class="Login_box_stuff">Password : <input type="text" placeholder="Enter password"></td>
                </tr>

                <label>Select Account Type:</label>
                    <select id="accountType" class="I">
                        <option value="user">User / Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="nurse">Nurse</option>
                        <option value="support">Support Staff</option>
                    </select>
                <br><br>
            </table>
        </form>
    </div>
        <button type="button" class="Sign_up_button" onclick="loginUser()">Login</button>
    </center>
</div>

<script>
function loginUser() {
    let type = document.getElementById("accountType").value;

    if (type === "user") {
        window.location.href = "users_account.html";
    } 
    else if (type === "doctor") {
        window.location.href = "doctor_account.html";
    } 
    else if (type === "nurse") {
        window.location.href = "nurse_account.html";
    } 
    else if (type === "support") {
        window.location.href = "support_account.html";
    } 
    else {
        alert("Select a valid account type!");
    }
}
</script>
